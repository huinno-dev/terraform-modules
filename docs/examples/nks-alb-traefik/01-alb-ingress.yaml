# ALB entry point: the ALB Ingress Controller creates one ALB from this
# Ingress and sends every request to Traefik (NodePort 32000).
# Replace the <...> placeholders before applying.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-alb
  namespace: traefik
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: <lb-name>
    alb.ingress.kubernetes.io/network-type: public
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80},{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-certificate-no: "<certificate-no>"
    alb.ingress.kubernetes.io/ssl-min-version: TLSV12
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /ping
spec:
  ingressClassName: alb
  defaultBackend:
    service:
      name: traefik
      port:
        number: 80
